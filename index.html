<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Technical & Primary SEO -->
    <title>45° — Creative Technology Company</title>
    <meta name="description" content="45° is a creative technology company studying problems from different angles to shape, create, and deliver brands, digital experiences, and operational business systems." />
    <meta name="keywords" content="45 degrees, creative technology, brand strategy, business systems, application development, digital workflows" />
    <meta name="author" content="45°" />
    <link rel="canonical" href="https://45degrees.company" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://45degrees.company" />
    <meta property="og:title" content="45° — Creative Technology Company" />
    <meta property="og:description" content="Studying problems from different angles. Shaping direction. Creating and delivering brand and technology solutions." />
    <meta property="og:site_name" content="45°" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="45° — Creative Technology Company" />
    <meta name="twitter:description" content="Studying problems from different angles. Shaping direction. Creating and delivering brand and technology solutions." />

    <!-- Security & Privacy Baseline: CSP + Referrer Policy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; connect-src 'self';" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Typography: Syne (Editorial/Display) + Inter (Crisp System Body) with preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD Organization Schema) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "45°",
        "alternateName": "45 Degrees",
        "url": "https://45degrees.company",
        "logo": "https://45degrees.company/favicon.svg",
        "description": "Creative technology company specializing in brand building, digital marketing, business application development, and workflow systems.",
        "knowsAbout": [
          "Brand Strategy",
          "Creative Direction",
          "Application Development",
          "Workflow Automation",
          "Data Management"
        ]
      }
    </script>
  </head>
  <body>
    <!-- Root mount element for React application -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
